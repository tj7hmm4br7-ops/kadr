name: Собрать фильмы и кадры

on:
  push:
    paths:
      - "build/**"
      - ".github/workflows/build-data.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Установить cwebp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp
      - name: Скачать данные и кадры с TMDB
        env:
          TMDB_KEY: 966527545daca912624d4852ef276bbc
        run: node build/build.mjs
      - name: Сохранить в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data img
          git commit -q -m "Данные и кадры фильмов" || { echo "нет изменений"; exit 0; }
          git push
